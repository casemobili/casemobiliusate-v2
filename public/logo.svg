  <path d="M25 17 H39 L59 24 H5 Z" fill="url(#cmu)"/>
  <rect x="9" y="26.5" width="46" height="14" rx="1" fill="url(#cmu)"/>
  <rect x="13" y="30" width="30" height="6" rx="1.5" fill="#1F2A1B"/>
  <rect x="46" y="30" width="6" height="10.5" rx="1" fill="#1F2A1B"/>
  <rect x="12" y="43" width="40" height="3" rx="1.5" fill="url(#cmu)" opacity="0.9"/>

  <!-- Wordmark su due righe: sta dentro il viewBox anche coi font di fallback -->
  <text x="80" y="36" font-family="Cormorant Garamond, Lora, Georgia, serif" font-weight="600" font-size="22" fill="#2B3A24">CaseMobili</text>
  <text x="80" y="55" font-family="Inter, sans-serif" font-weight="500" font-size="12" letter-spacing="2" fill="#9A7A3E">USATE.COM</text>
