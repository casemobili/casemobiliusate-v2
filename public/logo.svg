<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="CaseMobiliUsate.com">
  <defs>
    <linearGradient id="cmu" x1="32" y1="17" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6D094"/>
      <stop offset="1" stop-color="#B89653"/>
    </linearGradient>
  </defs>

  <!-- Marchio: casa mobile disegnata sulla referenza reale — tetto come fascia
