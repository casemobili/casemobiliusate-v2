<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CaseMobiliUsate.com">
  <defs>
    <linearGradient id="cmu" x1="32" y1="22" x2="32" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6D094"/>
      <stop offset="1" stop-color="#B89653"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1F2A1B"/>
  <!-- Tetto a falda bassissima: una casa mobile non ha il tetto a punta -->
  <path d="M23 22 H41 L57 30 H7 Z" fill="url(#cmu)"/>
  <!-- Gronda sporgente su tutta la larghezza: e' la firma del profilo -->
  <rect x="4" y="30" width="56" height="3" rx="1.5" fill="url(#cmu)"/>
  <!-- Corpo largo e basso (quasi 3:1) con la porta intagliata sul bordo -->
  <path d="M10 33 H54 V48 H42 V38.5 H34 V48 H10 Z" fill="url(#cmu)"/>
  <!-- Fascia finestre orizzontale -->
  <rect x="14" y="37.5" width="16" height="5.5" rx="1" fill="#1F2A1B"/>
  <!-- Basamento: appoggiata sulla piazzola, non fondata a terra -->
