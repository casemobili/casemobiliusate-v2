<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CaseMobiliUsate.com">
  <defs>
    <linearGradient id="cmu" x1="32" y1="18" x2="32" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6D094"/>
      <stop offset="1" stop-color="#B89653"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1F2A1B"/>
  <!-- Tetto a falda bassa con gronda sporgente su tutta la lunghezza -->
  <path d="M22 18 H42 L58 26 H6 Z" fill="url(#cmu)"/>
  <!-- Corpo lungo e basso, quasi 3:1 -->
  <rect x="10" y="26" width="44" height="16" rx="1" fill="url(#cmu)"/>
  <!-- Facciata ASIMMETRICA: fascia finestre lunga a sinistra, porta al bordo destro.
       E' l'asimmetria a distinguere l'unita' da campeggio dalla casa tradizionale. -->
  <rect x="15" y="30" width="24" height="6" rx="1.5" fill="#1F2A1B"/>
  <rect x="43" y="30" width="8" height="12" rx="1" fill="#1F2A1B"/>
  <!-- Gradino d'ingresso: appoggiata sulla piazzola, non fondata a terra -->
  <rect x="41" y="43.5" width="12" height="3" rx="1.5" fill="url(#cmu)"/>
</svg>
