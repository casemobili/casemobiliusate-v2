<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CaseMobiliUsate.com">
  <defs>
    <linearGradient id="cmu" x1="32" y1="17" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6D094"/>
      <stop offset="1" stop-color="#B89653"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1F2A1B"/>
  <!-- Tetto come FASCIA STACCATA dal corpo: nella realta' e' di materiale
       diverso (lamiera/tegola) e si stacca visivamente dal rivestimento. -->
  <path d="M25 17 H39 L59 24 H5 Z" fill="url(#cmu)"/>
  <!-- Corpo lungo e basso, gronda che sporge di 4 unita' per lato -->
  <rect x="9" y="26.5" width="46" height="14" rx="1" fill="url(#cmu)"/>
  <!-- Finestre a nastro e porta stretta in fondo: la facciata e' asimmetrica -->
  <rect x="13" y="30" width="30" height="6" rx="1.5" fill="#1F2A1B"/>
  <rect x="46" y="30" width="6" height="10.5" rx="1" fill="#1F2A1B"/>
  <!-- Sollevata da terra sugli appoggi, con lo stacco visibile sotto il corpo -->
  <rect x="12" y="43" width="40" height="3" rx="1.5" fill="url(#cmu)" opacity="0.9"/>
</svg>
